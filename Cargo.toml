[workspace]
members = [
  "crates/arcana-agent",
  "crates/arcana-cli",
  "crates/arcana-core",
  "crates/arcana-server",
  "crates/arcana-tui",
]
resolver = "2"
default-members = ["crates/arcana-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
# Serialization
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"

# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IDs
uuid = { version = "1", features = ["v4"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# File system
git2 = { version = "0.19", features = ["vendored-openssl"] }
globset = "0.4"
notify = "7"
notify-debouncer-mini = "0.5"
walkdir = "2"

# Hashing
base64 = "0.22"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Parallelism
rayon = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }
colored = "3"
indicatif = "0.17"
rustyline = "14"

# Diff
similar = "2"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Regex
regex = "1"

# MCP server
axum = "0.8"
rmcp = { version = "1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "0.8"
subtle = "2"

# Testing
tempfile = "3"
